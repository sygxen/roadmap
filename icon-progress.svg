<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* Same colors as style.css: --accent (chart line), --green (progress bars), --orange ("En cours") */
    :root { --blue: #2f6fed; --green: #1f9d55; --orange: #e8890c; }
    @media (prefers-color-scheme: dark) {
      :root { --blue: #6c9bff; --green: #3ec27a; --orange: #f0a030; }
    }
  </style>
  <rect width="64" height="64" rx="14" fill="var(--blue)"/>
  <!-- Three rising bars: two complete (green), one in progress (orange), on a baseline -->
  <rect x="12" y="38" width="10" height="14" rx="2.5" fill="var(--green)"/>
  <rect x="27" y="26" width="10" height="26" rx="2.5" fill="var(--green)"/>
  <rect x="42" y="12" width="10" height="40" rx="2.5" fill="var(--orange)"/>
  <rect x="9" y="54" width="46" height="3" rx="1.5" fill="#ffffff"/>
</svg>
