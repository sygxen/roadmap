<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* Same colors as style.css: --accent (chart line), --green (progress bars), --orange ("En cours") */
    :root { --blue: #2f6fed; --green: #1f9d55; --orange: #e8890c; }
    @media (prefers-color-scheme: dark) {
      :root { --blue: #6c9bff; --green: #3ec27a; --orange: #f0a030; }
    }
  </style>
  <rect width="64" height="64" rx="14" fill="var(--blue)"/>
  <!-- Winding road going up, with three milestones: two done (green), one in progress (orange) -->
  <path d="M15 49 C32 49 20 32 34 32 S41 15 49 15" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M15 49 C32 49 20 32 34 32 S41 15 49 15" fill="none" stroke="var(--blue)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 4"/>
  <circle cx="15" cy="49" r="7" fill="var(--green)"/>
  <circle cx="34" cy="32" r="6" fill="var(--green)"/>
  <circle cx="49" cy="15" r="8" fill="var(--orange)"/>
</svg>
